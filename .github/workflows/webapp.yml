name: WebApp CI

on:
  push:
    branches: [main]
    paths: ['TrimUrlWebApp/**', '.github/workflows/webapp.yml']
  pull_request:
    branches: [main]
    paths: ['TrimUrlWebApp/**', '.github/workflows/webapp.yml']

permissions:
  contents: read

jobs:
  ci:
    name: Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TrimUrlWebApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TrimUrlWebApp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
